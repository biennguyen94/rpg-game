<title>Hắc Long RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Một khung dọc kiểu điện thoại: HUD cố định trên, nội dung cuộn giữa, thanh tab dưới.
   Giao diện tối có chủ đích (thế giới ngục tối), không đổi theo theme hệ thống. */
:root {
  --ink: #16121c;      /* nền */
  --ink-2: #201a27;    /* thẻ */
  --ink-3: #2c2436;    /* nút, ô nổi */
  --line: #3b3147;     /* viền */
  --parch: #ecdfc4;    /* chữ chính, màu giấy da */
  --dim: #a89cae;      /* chữ phụ */
  --gold: #e9c46a;     /* nhấn: vàng, icon */
  --blood: #c8432f;    /* máu */
  --xp: #5ea8bd;       /* kinh nghiệm */
  --good: #86b56d;
  --bad: #e0705b;
  --display: 'Grenze Gotisch', 'Palatino Linotype', Georgia, serif;
  --body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 10px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--parch);
  font: 15px/1.5 var(--body);
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(120% 60% at 50% 0%, #2a1f33 0%, transparent 60%),
    var(--ink);
  box-shadow: 0 0 0 1px var(--line);
}
#view {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  outline: none;
}
#view > * { flex-shrink: 0; }

/* ---------- Chữ ---------- */
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
.display { font-family: var(--display); font-weight: 600; letter-spacing: 0.01em; }
h2.display { font-size: 1.7rem; line-height: 1.1; color: var(--gold); }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--dim); }
.small { font-size: 0.82rem; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }

/* ---------- Icon & sprite ---------- */
.ic { width: 22px; height: 22px; flex: none; display: inline-block; vertical-align: middle; }
.ic.lg { width: 34px; height: 34px; }
.sprite { image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }

/* ---------- HUD ---------- */
#hud {
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  background: linear-gradient(#1c1623, #18131e);
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 8px;
}
.hud-top { display: flex; align-items: center; gap: 10px; }
.hud-top .sprite { width: 40px; height: 40px; background: var(--ink-3); border-radius: 8px; border: 1px solid var(--line); }
.hud-name { font-weight: 700; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-who { flex: 1; min-width: 0; }
.gold { display: flex; align-items: center; gap: 5px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.points-dot { background: var(--gold); color: var(--ink); border-radius: 99px; font-size: 0.7rem; font-weight: 700; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }

.bar { position: relative; height: 16px; border-radius: 99px; background: #0e0b12; border: 1px solid var(--line); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; transition: width 0.35s ease; }
.bar.hp > i { background: linear-gradient(#e0583f, var(--blood)); }
.bar.xp > i { background: linear-gradient(#78c0d3, var(--xp)); }
.bar.boss > i { background: linear-gradient(#b86be0, #7b3aa5); }
.bar > span { position: relative; display: block; text-align: center; font-size: 0.7rem; font-weight: 600; line-height: 14px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 1px #000; }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- Tabs ---------- */
#tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line);
  background: #18131e;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#tabs button {
  background: none; border: 0; padding: 8px 2px 7px;
  display: grid; justify-items: center; gap: 2px;
  font-size: 0.72rem; color: var(--dim); cursor: pointer;
}
#tabs button .ic { opacity: 0.55; }
#tabs button[aria-current="page"] { color: var(--gold); }
#tabs button[aria-current="page"] .ic { opacity: 1; }

/* ---------- Thẻ & danh sách ---------- */
.card { background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row > .grow { flex: 1; min-width: 0; }
.list { display: grid; }
.list > .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.list > .item:first-child { border-top: 0; padding-top: 0; }
.list > .item:last-child { padding-bottom: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .name { font-weight: 600; }
.tag { font-size: 0.72rem; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.tag.gold { color: var(--gold); border-color: #6b5a2e; }
.tag.good { color: var(--good); border-color: #3e5634; }
.tag.bad { color: var(--bad); border-color: #6a3027; }
.up { color: var(--good); font-weight: 600; }

/* ---------- Nút ---------- */
.btn {
  appearance: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--ink-3);
  border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 0.88rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap; transition: transform 0.05s, background 0.15s;
}
.btn:active { transform: translateY(1px); }
.btn:hover { background: #362c42; }
.btn.primary { background: linear-gradient(#f0cf7a, #d9ae4a); color: #2a1d06; border-color: #b58f35; }
.btn.primary:hover { background: linear-gradient(#f5d88a, #e0b653); }
.btn.danger { background: #4a1f1a; border-color: #7a3328; color: #f3c2b6; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn.block { width: 100%; padding: 12px; font-size: 1rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row > .btn { flex: 1; }

/* ---------- Tạo nhân vật ---------- */
.intro { text-align: center; display: grid; gap: 6px; padding: 18px 0 4px; justify-items: center; }
.intro .sprite { width: 128px; height: 128px; filter: drop-shadow(0 8px 18px #000); }
.intro h1 { font-family: var(--display); font-size: 3rem; line-height: 1; color: var(--gold); font-weight: 800; letter-spacing: 0.02em; }
.intro p { max-width: 34ch; color: var(--dim); }
label.field { display: grid; gap: 6px; font-weight: 600; }
input[type="text"] {
  font: inherit; color: var(--parch); background: #0f0c13; border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; width: 100%;
}
.classes { display: grid; gap: 8px; }
.class-opt { text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.class-opt[aria-pressed="true"] { border-color: var(--gold); background: #2b2230; box-shadow: inset 0 0 0 1px var(--gold); }
.class-opt .stats { font-size: 0.75rem; color: var(--dim); font-variant-numeric: tabular-nums; }

/* ---------- Khu vực ---------- */
.zone { position: relative; overflow: hidden; }
.zone.locked { opacity: 0.55; }
.zone .mobs { display: flex; gap: 4px; flex-wrap: wrap; }
.zone .mobs .sprite { width: 32px; height: 32px; background: #0f0c13; border-radius: 6px; }
.zone .mobs .sprite.boss { outline: 1px solid var(--gold); }
.zone.cleared .zone-status { color: var(--good); }

/* ---------- Hành trình ---------- */
.journey { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.journey .step { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 0.66rem; color: var(--dim); }
.journey .step .sprite { width: 40px; height: 40px; border-radius: 8px; background: #0f0c13; border: 1px solid var(--line); filter: grayscale(1) brightness(0.45); }
.journey .step.done .sprite { filter: none; border-color: var(--good); }
.journey .step.next .sprite { filter: none; border-color: var(--gold); }

/* ---------- Chỉ số ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: #0f0c13; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.alloc .btn { padding: 4px 10px; min-width: 40px; }

/* ---------- Trận đấu ---------- */
.stage {
  position: relative; border-radius: var(--r); border: 1px solid var(--line); overflow: hidden;
  display: grid; justify-items: center; gap: 6px; padding: 16px 14px 14px;
  background-size: 64px 64px; image-rendering: pixelated;
}
.stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(22,18,28,0.35), rgba(22,18,28,0.92) 70%); }
.stage > * { position: relative; }
.stage .sprite { width: 144px; height: 144px; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.8)); }
.stage.boss .sprite { width: 176px; height: 176px; }
.stage h2 { font-family: var(--display); font-size: 2rem; line-height: 1; color: var(--parch); text-shadow: 0 2px 0 #000; }
.stage.boss h2 { color: var(--gold); }
.stage .bar { width: 100%; }
.stage .sprite.hit { animation: hit 0.3s; }
@keyframes hit { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); filter: brightness(2.2) drop-shadow(0 0 6px #fff); } 60% { transform: translateX(5px); } }
.float { position: absolute; top: 34%; left: 50%; font-weight: 800; font-size: 1.6rem; color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px #000; pointer-events: none; animation: rise 0.9s ease-out forwards; font-variant-numeric: tabular-nums; }
.float.crit { color: var(--gold); font-size: 2rem; }
.float.miss { color: var(--dim); font-size: 1.1rem; }
@keyframes rise { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -48px); opacity: 0; } }
.me { display: flex; align-items: center; gap: 10px; }
.me .sprite { width: 40px; height: 40px; }
.me.hurt .sprite { animation: hit 0.3s; }

.log { background: #0f0c13; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; height: 150px; overflow-y: auto; display: grid; align-content: start; gap: 3px; font-size: 0.86rem; }
.log .hit { color: var(--parch); }
.log .crit { color: var(--gold); font-weight: 600; }
.log .bad { color: var(--bad); }
.log .good { color: var(--good); }
.log .win { color: var(--gold); font-weight: 600; }
.log .info { color: var(--dim); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn { padding: 13px 8px; font-size: 0.95rem; }
.result { text-align: center; }
.result h2 { font-family: var(--display); font-size: 2.2rem; line-height: 1; }
.result.win h2 { color: var(--gold); }
.result.lose h2 { color: var(--bad); }

/* ---------- Toast & xác nhận ---------- */
#toast {
  position: fixed; left: 50%; top: calc(100px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px);
  background: #0f0c13; border: 1px solid var(--gold); color: var(--parch); padding: 8px 14px; border-radius: 99px;
  font-size: 0.88rem; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100% - 32px); text-align: center; z-index: 10;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { border-color: var(--bad); }

.victory { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 10px 0; }
.victory .sprite { width: 160px; height: 160px; transform: rotate(90deg); filter: grayscale(0.6) brightness(0.7); }
.victory h1 { font-family: var(--display); font-size: 2.6rem; line-height: 1; color: var(--gold); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.btn.primary .ic { filter: brightness(0.3); }
#tabs button { position: relative; }
#tabs .points-dot { position: absolute; top: 4px; left: calc(50% + 6px); margin: 0; }

</style>
<div id="app">
  <header id="hud" hidden></header>
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" hidden></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

  // slot: weapon | armor | shield | potion
  const ITEMS = {

    // Khiên
    round:       { name: 'Khiên Tròn',     slot: 'shield', icon: 'round-shield',   def: 3,  price: 90,   level: 4 },
    checked:     { name: 'Khiên Hiệp Sĩ',  slot: 'shield', icon: 'checked-shield', def: 7,  price: 450,  level: 10 },
    spiked:      { name: 'Khiên Gai',      slot: 'shield', icon: 'spiked-shield',  def: 12, price: 1500, level: 17 },
    dragonshield:{ name: 'Khiên Vảy Rồng', slot: 'shield', icon: 'dragon-shield',  def: 20, price: 0,    level: 24, drop: true },

    // Bình máu
    potion_s:    { name: 'Bình Máu Nhỏ',   slot: 'potion', icon: 'health-potion', heal: 60,  price: 15 },

    potion_l:    { name: 'Bình Máu Lớn',   slot: 'potion', icon: 'magic-potion',  heal: 650, price: 150 },
  };

  // Đồ rơi đặc biệt từ trùm (lần đầu hạ)
  const BOSS_DROPS = {
    hill_giant: 'dragonshield',
    golden_dragon: 'relic',
  };

  const SHOP = ['potion_s', 'potion_m', 'potion_l',
    'dagger', 'broadsword', 'mace', 'battleaxe', 'greatsword', 'waraxe',
    'leather', 'chain', 'scale', 'lamellar', 'breastplate',
    'round', 'checked', 'spiked'];

  const DATA = { CLASSES, ZONES, ITEMS, BOSS_DROPS, SHOP };
  if (typeof module !== 'undefined' && module.exports) module.exports = DATA;
  else root.GAME_DATA = DATA;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Logic game thuần (không đụng tới DOM) để chạy được cả trên trình duyệt lẫn Node
 * (dùng cho mô phỏng cân bằng). Mọi thay đổi trạng thái đi qua các hàm ở đây. */
(function (root) {
  const D = (typeof module !== 'undefined' && module.exports) ? require('./data.js') : root.GAME_DATA;
  const { CLASSES, ZONES, ITEMS, BOSS_DROPS } = D;

  const SAVE_VERSION = 1;
  const POINTS_PER_LEVEL = 3;
  const MAX_LEVEL = 50;
  let rng = Math.random;

  const rand = (a, b) => a + rng() * (b - a);
  const chance = (p) => rng() < p;
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---------- Nhân vật ----------
  function newPlayer(name, cls) {
    const c = CLASSES[cls];
    if (!c) throw new Error('Lớp nhân vật không hợp lệ');
    const p = {
      version: SAVE_VERSION,
      name: String(name || 'Hiệp Khách').trim().slice(0, 16) || 'Hiệp Khách',
      cls,
      level: 1,
      xp: 0,
      gold: 30,
      stats: { ...c.base },
      points: 0,
      equip: { weapon: 'club', armor: 'vest', shield: null },
      inv: { potion_s: 3 },
      bosses: [],        // id các trùm đã hạ
      kills: 0,
      deaths: 0,
      victory: false,
      battle: null,
      hp: 0,
    };
    p.hp = derived(p).maxHp;
    return p;
  }

  function derived(p) {
    const s = p.stats;
    const w = ITEMS[p.equip.weapon], a = ITEMS[p.equip.armor], sh = p.equip.shield ? ITEMS[p.equip.shield] : null;
    return {
      maxHp: Math.round(40 + s.vit * 12 + p.level * 10),
      atk: Math.round(s.str * 2.2 + s.agi * 0.9 + (w ? w.atk : 0) + p.level),
      def: Math.round(s.def * 1.6 + (a ? a.def : 0) + (sh ? sh.def : 0) + p.level * 0.5),
      crit: clamp(0.04 + s.agi * 0.008, 0, 0.6),
      critMult: Math.min(2.5, 1.6 + s.agi * 0.006),
      dodge: clamp(0.02 + s.agi * 0.005, 0, 0.4),
    };
  }

  const xpToNext = (lv) => Math.round(25 * Math.pow(lv, 1.75) + 15);

  function zoneUnlocked(p, zi) {
    if (zi === 0) return true;
    return p.bosses.includes(ZONES[zi - 1].boss.id);
  }

  // ---------- Quái ----------
  function makeMonster(def, isBoss) {
    const L = def.level, m = def.mult || 1;
    return {
      id: def.id, name: def.name, level: L, boss: !!isBoss, final: !!def.final,
      special: def.special || null,
      maxHp: Math.round((20 + L * 26 + L * L * 0.6) * m * (isBoss ? 2.4 : 1)),
      atk: Math.round((10 + L * 6.4) * m * (isBoss ? 1 : 1)),
      def: Math.round((1 + L * 2.0) * m),
      crit: 0.05,
      dodge: 0.03 + L * 0.001,
      xp: Math.round((8 + L * 6 + L * L * 0.5) * m * (isBoss ? 5 : 1)),
      gold: Math.round((3 + L * 2.2) * m * rand(0.8, 1.2) * (isBoss ? 6 : 1)),
    };
  }

  function damage(atk, def) {
    return Math.max(1, Math.round((atk * atk) / (atk + def) * rand(0.9, 1.1)));
  }

  // ---------- Chiến đấu ----------
  function startBattle(p, zi, boss) {
    if (p.battle) return { ok: false, msg: 'Đang trong trận đấu.' };
    if (!zoneUnlocked(p, zi)) return { ok: false, msg: 'Khu vực chưa mở.' };
    if (p.hp <= 0) return { ok: false, msg: 'Bạn cần hồi máu trước.' };
    const z = ZONES[zi];
    // Quái thường: ưu tiên con không quá cấp người chơi + 1 để người mới không bị đánh úp.
    const fair = z.monsters.filter((x) => x.level <= p.level + 1);
    const m = makeMonster(boss ? z.boss : pick(fair.length ? fair : [z.monsters[0]]), boss);
    m.hp = m.maxHp;
    p.battle = { zone: zi, monster: m, turn: 0, skillCd: 0, log: [], over: false, result: null, reward: null };
    log(p, boss ? `⚔️ ${m.name} (Cấp ${m.level}) xuất hiện!` : `Bạn gặp ${m.name} (Cấp ${m.level}).`, 'info');
    return { ok: true };
  }

  function log(p, text, kind) {
    p.battle.log.push({ text, kind: kind || '' });
    if (p.battle.log.length > 60) p.battle.log.shift();
  }

  function bestPotion(p, missing) {
    const owned = ['potion_s', 'potion_m', 'potion_l'].filter((id) => (p.inv[id] || 0) > 0);
    if (!owned.length) return null;
    // Bình nhỏ nhất đủ hồi phần máu đã mất, nếu không có thì bình lớn nhất đang có.
    return owned.find((id) => ITEMS[id].heal >= missing) || owned[owned.length - 1];
  }

  function drink(p, id) {
    const d = derived(p);
    const before = p.hp;
    p.hp = Math.min(d.maxHp, p.hp + ITEMS[id].heal);
    p.inv[id]--;
    if (!p.inv[id]) delete p.inv[id];
    return p.hp - before;
  }

  // action: 'attack' | 'skill' | 'potion' | 'flee'
  function act(p, action) {
    const b = p.battle;
    if (!b || b.over) return { ok: false, msg: 'Không có trận đấu.' };
    const d = derived(p), m = b.monster, skill = CLASSES[p.cls].skill;
    b.turn++;

    if (action === 'flee') {
      if (chance(m.boss ? 0.35 : 0.7)) {
        log(p, 'Bạn đã bỏ chạy thành công.', 'info');
        return finish(p, 'fled');
      }
      log(p, 'Bỏ chạy thất bại!', 'bad');
    } else if (action === 'potion') {
      const id = bestPotion(p, d.maxHp - p.hp);
      if (!id) { b.turn--; return { ok: false, msg: 'Hết bình máu.' }; }
      if (p.hp >= d.maxHp) { b.turn--; return { ok: false, msg: 'Máu đang đầy.' }; }
      const healed = drink(p, id);
      log(p, `Bạn uống ${ITEMS[id].name}, hồi ${healed} máu.`, 'good');
    } else {
      let atk = d.atk, def = m.def, crit = chance(d.crit), mult = 1, name = 'tấn công';
      if (action === 'skill') {
        if (b.skillCd > 0) { b.turn--; return { ok: false, msg: `Kỹ năng hồi sau ${b.skillCd} lượt.` }; }
        b.skillCd = skill.cooldown + 1; // +1 vì cuối lượt sẽ trừ 1
        name = skill.name;
        if (skill.id === 'cleave') mult = 2.2;
        if (skill.id === 'backstab') { crit = true; def = Math.round(def * 0.5); }
        if (skill.id === 'holy') {
          mult = 1.3;
          const heal = Math.round(d.maxHp * 0.25);
          const before = p.hp; p.hp = Math.min(d.maxHp, p.hp + heal);
          log(p, `Khiên Thánh hồi ${p.hp - before} máu.`, 'good');
        }
      }
      if (action !== 'skill' && chance(m.dodge)) {
        log(p, `${m.name} né được đòn ${name}.`, 'info');
      } else {
        let dmg = Math.round(damage(atk, def) * mult * (crit ? d.critMult : 1));
        m.hp = Math.max(0, m.hp - dmg);
        log(p, `${action === 'skill' ? '✨ ' + name + ': ' : ''}Bạn gây ${dmg} sát thương${crit ? ' (CHÍ MẠNG!)' : ''}.`, crit ? 'crit' : 'hit');
      }
      if (m.hp <= 0) return win(p);
    }

    // Lượt quái
    let mAtk = m.atk, special = false;
    if (m.special && b.turn % m.special.every === 0) { mAtk = Math.round(m.atk * m.special.mult); special = true; }
    if (!special && chance(d.dodge)) {
      log(p, `Bạn né được đòn của ${m.name}.`, 'info');
    } else {
      const mc = !special && chance(m.crit);
      const dmg = Math.round(damage(mAtk, d.def) * (mc ? 1.5 : 1));
      p.hp = Math.max(0, p.hp - dmg);
      log(p, special ? `🔥 ${m.name} dùng ${m.special.name}! Bạn mất ${dmg} máu.` : `${m.name} đánh bạn ${dmg} máu${mc ? ' (chí mạng)' : ''}.`, 'bad');
    }
    if (p.hp <= 0) return lose(p);
    if (b.skillCd > 0) b.skillCd--;
    return { ok: true };
  }

  function win(p) {
    const b = p.battle, m = b.monster;
    p.kills++;
    const reward = { xp: m.xp, gold: m.gold, items: [], levels: 0 };
    p.gold += m.gold;
    log(p, `🏆 Bạn đã hạ ${m.name}! +${m.xp} kinh nghiệm, +${m.gold} vàng.`, 'win');
    if (!m.boss && chance(0.12)) {
      const id = m.level >= 20 ? 'potion_l' : m.level >= 9 ? 'potion_m' : 'potion_s';
      addItem(p, id); reward.items.push(id);
      log(p, `Nhặt được ${ITEMS[id].name}.`, 'good');
    }
    if (m.boss) {
      const first = !p.bosses.includes(m.id);
      if (first) {
        p.bosses.push(m.id);
        const drop = BOSS_DROPS[m.id];
        if (drop) { addItem(p, drop); reward.items.push(drop); log(p, `Trùm rơi ra ${ITEMS[drop].name}!`, 'win'); }
        const zi = b.zone;
        if (m.final) { p.victory = true; log(p, 'Hắc Long đã gục ngã. Vùng đất được giải phóng!', 'win'); }
        else if (ZONES[zi + 1]) log(p, `Đã mở khu vực mới: ${ZONES[zi + 1].name}.`, 'win');
      }
    }
    reward.levels = gainXp(p, m.xp);
    if (reward.levels) log(p, `⭐ Lên cấp ${p.level}! Nhận ${reward.levels * POINTS_PER_LEVEL} điểm tiềm năng.`, 'win');
    b.reward = reward;
    return finish(p, 'win');
  }

  function lose(p) {
    const lost = Math.floor(p.gold * 0.1);
    p.gold -= lost;
    p.deaths++;
    log(p, `💀 Bạn đã gục ngã... Mất ${lost} vàng. Dân làng đưa bạn về nhà trọ.`, 'bad');
    p.hp = Math.round(derived(p).maxHp * 0.5);
    return finish(p, 'lose');
  }

  function finish(p, result) {
    p.battle.over = true;
    p.battle.result = result;
    return { ok: true, result };
  }

  function leaveBattle(p) {
    if (p.battle && p.battle.over) p.battle = null;
  }

  function gainXp(p, xp) {
    let levels = 0;
    p.xp += xp;
    while (p.level < MAX_LEVEL && p.xp >= xpToNext(p.level)) {
      p.xp -= xpToNext(p.level);
      p.level++;
      levels++;
      const g = CLASSES[p.cls].growth;
      for (const k in g) p.stats[k] += g[k];
      p.points += POINTS_PER_LEVEL;
    }
    if (p.level >= MAX_LEVEL) p.xp = 0;
    if (levels) p.hp = derived(p).maxHp;
    return levels;
  }

  // ---------- Đồ đạc ----------
  function addItem(p, id, n) { p.inv[id] = (p.inv[id] || 0) + (n || 1); }

  function buy(p, id, n) {
    n = n || 1;
    const it = ITEMS[id];
    if (!it || it.drop) return { ok: false, msg: 'Không bán món này.' };
    if (it.level && p.level < it.level) return { ok: false, msg: `Cần cấp ${it.level}.` };
    const cost = it.price * n;
    if (p.gold < cost) return { ok: false, msg: 'Không đủ vàng.' };
    p.gold -= cost;
    addItem(p, id, n);
    return { ok: true, msg: `Đã mua ${n > 1 ? n + ' ' : ''}${it.name}.` };
  }

  const sellPrice = (id) => Math.floor((ITEMS[id].price || 200) * 0.4);

  function sell(p, id) {
    if (!p.inv[id]) return { ok: false, msg: 'Không có món này.' };
    const g = sellPrice(id);
    p.inv[id]--;
    if (!p.inv[id]) delete p.inv[id];
    p.gold += g;
    return { ok: true, msg: `Đã bán ${ITEMS[id].name} được ${g} vàng.` };
  }

  function equip(p, id) {
    const it = ITEMS[id];
    if (!it || !p.inv[id] || !['weapon', 'armor', 'shield'].includes(it.slot)) return { ok: false, msg: 'Không trang bị được.' };
    if (it.level && p.level < it.level) return { ok: false, msg: `Cần cấp ${it.level}.` };
    const hpRatio = p.hp / derived(p).maxHp;
    const old = p.equip[it.slot];
    p.inv[id]--; if (!p.inv[id]) delete p.inv[id];
    if (old) addItem(p, old);
    p.equip[it.slot] = id;
    p.hp = Math.round(hpRatio * derived(p).maxHp);
    return { ok: true, msg: `Đã trang bị ${it.name}.` };
  }

  function unequip(p, slot) {
    if (slot !== 'shield' || !p.equip.shield) return { ok: false, msg: 'Không tháo được.' };
    addItem(p, p.equip.shield);
    p.equip.shield = null;
    return { ok: true, msg: 'Đã tháo khiên.' };
  }

  function usePotion(p, id) {
    if (p.battle) return { ok: false, msg: 'Dùng nút Uống máu trong trận.' };
    if (!p.inv[id] || ITEMS[id].slot !== 'potion') return { ok: false, msg: 'Không có bình này.' };
    if (p.hp >= derived(p).maxHp) return { ok: false, msg: 'Máu đang đầy.' };
    const h = drink(p, id);
    return { ok: true, msg: `Hồi ${h} máu.` };
  }

  const restCost = (p) => (p.hp >= derived(p).maxHp ? 0 : Math.max(0, p.level * 4 - 4));

  function rest(p) {
    if (p.battle) return { ok: false, msg: 'Đang trong trận.' };
    const c = restCost(p);
    if (p.hp >= derived(p).maxHp) return { ok: false, msg: 'Máu đang đầy.' };
    if (p.gold < c) return { ok: false, msg: `Cần ${c} vàng.` };
    p.gold -= c;
    p.hp = derived(p).maxHp;
    return { ok: true, msg: c ? `Nghỉ trọ hết ${c} vàng. Máu đã đầy.` : 'Nghỉ ngơi miễn phí. Máu đã đầy.' };
  }

  function allocate(p, stat, n) {
    n = n || 1;
    if (!['str', 'vit', 'agi', 'def'].includes(stat)) return { ok: false, msg: 'Chỉ số không hợp lệ.' };
    if (p.points < n) return { ok: false, msg: 'Hết điểm tiềm năng.' };
    const before = derived(p).maxHp;
    p.stats[stat] += n;
    p.points -= n;
    p.hp += derived(p).maxHp - before; // tăng thể lực thì cộng luôn máu
    return { ok: true };
  }

  // ---------- Lưu game ----------
  function serialize(p) { return JSON.stringify(p); }

  function deserialize(str) {
    const p = JSON.parse(str);
    if (!p || p.version !== SAVE_VERSION || !CLASSES[p.cls]) throw new Error('File lưu không hợp lệ');
    return p;
  }

  const Engine = {
    newPlayer, derived, xpToNext, zoneUnlocked, makeMonster, startBattle, act, leaveBattle,
    buy, sell, sellPrice, equip, unequip, usePotion, rest, restCost, allocate, gainXp, addItem,
    serialize, deserialize, bestPotion,
    setRng(f) { rng = f; },
    POINTS_PER_LEVEL, MAX_LEVEL,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Giao diện: vẽ lại từng màn hình từ trạng thái người chơi (P) sau mỗi thao tác. */
(function () {
  const { CLASSES, ZONES, ITEMS, SHOP } = window.GAME_DATA;
  const E = window.Engine;
  const SAVE_KEY = 'hac-long-rpg-save-v1';

  let P = null;          // trạng thái người chơi
  let tab = 'town';      // tab đang mở
  let pickCls = 'warrior';
  let confirmReset = false;
  let fx = null;         // hiệu ứng trận đấu của lượt vừa rồi

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Math.round(n).toLocaleString('vi-VN');

  // Bản build một file nhét ảnh vào window.ASSET_DATA; bản thường đọc từ thư mục assets/.
  const asset = (path) => (window.ASSET_DATA && window.ASSET_DATA[path]) || 'assets/' + path;
  const icon = (name, cls) => `<img class="ic ${cls || ''}" src="${asset('icons/' + name + '.svg')}" alt="">`;
  const sprite = (id, cls, alt) => `<img class="sprite ${cls || ''}" src="${asset('monsters/' + id + '.png')}" alt="${esc(alt || '')}">`;

  // ---------- Lưu / tải ----------
  function save() {
    try { if (P) localStorage.setItem(SAVE_KEY, E.serialize(P)); else localStorage.removeItem(SAVE_KEY); } catch (e) { /* trình duyệt chặn lưu */ }
  }
  function load() {
    try { const s = localStorage.getItem(SAVE_KEY); return s ? E.deserialize(s) : null; } catch (e) { return null; }
  }

  let toastTimer;
  function toast(msg, err) {
    if (!msg) return;
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = err ? 'err' : ''; }, 1800);
  }

  function result(r) {
    if (!r) return;
    if (!r.ok) toast(r.msg, true); else if (r.msg) toast(r.msg);
  }

  // ---------- Khung ----------
  function render() {
    const hud = $('#hud'), tabs = $('#tabs'), view = $('#view');
    if (!P) {
      hud.hidden = true; tabs.hidden = true;
      view.innerHTML = viewCreate();
      return;
    }
    hud.hidden = false;
    hud.innerHTML = viewHud();
    if (P.battle) {
      tabs.hidden = true;
      view.innerHTML = viewBattle();
      const log = view.querySelector('.log');
      if (log) log.scrollTop = log.scrollHeight;
      fx = null;
      return;
    }
    tabs.hidden = false;
    tabs.innerHTML = [
      ['town', 'village', 'Làng'],
      ['hunt', 'crossed-swords', 'Săn quái'],
      ['hero', 'person', 'Nhân vật'],
      ['bag', 'backpack', 'Túi đồ'],
      ['shop', 'shop', 'Cửa hàng'],
    ].map(([id, ic, label]) => `<button data-tab="${id}" ${tab === id ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}${id === 'hero' && P.points ? `<span class="points-dot">${P.points}</span>` : ''}</span></button>`).join('');
    view.innerHTML = P.victory && tab === 'town' ? viewVictory() + viewTown() : ({ town: viewTown, hunt: viewHunt, hero: viewHero, bag: viewBag, shop: viewShop }[tab])();
  }

  function bar(kind, cur, max, label) {
    const w = max ? Math.max(0, Math.min(100, (cur / max) * 100)) : 0;
    return `<div class="bar ${kind}"><i style="width:${w}%"></i><span>${label || `${fmt(cur)} / ${fmt(max)}`}</span></div>`;
  }

  function viewHud() {
    const d = E.derived(P), need = E.xpToNext(P.level);
    return `
      <div class="hud-top">
        ${sprite('hero', '', 'Nhân vật')}
        <div class="hud-who">
          <div class="hud-name">${esc(P.name)}</div>
          <div class="small muted">${CLASSES[P.cls].name} · Cấp ${P.level}</div>
        </div>
        <div class="gold">${icon('two-coins')}${fmt(P.gold)}</div>
      </div>
      <div class="bars">
        ${bar('hp', P.hp, d.maxHp, `❤ ${fmt(P.hp)} / ${fmt(d.maxHp)}`)}
        ${P.level >= E.MAX_LEVEL ? bar('xp', 1, 1, 'Cấp tối đa') : bar('xp', P.xp, need, `EXP ${Math.floor((P.xp / need) * 100)}%`)}
      </div>`;
  }

  // ---------- Tạo nhân vật ----------
  function viewCreate() {
    return `
      <div class="intro">
        ${sprite('shadow_dragon', '', 'Hắc Long')}
        <h1>Hắc Long</h1>
        <p>Hắc Long đã khủng bố vùng đất này nhiều năm. Rèn luyện qua sáu vùng đất, hạ các trùm canh giữ và tiêu diệt nó.</p>
      </div>
      <form id="create" class="card" autocomplete="off">
        <label class="field" for="hero-name">Tên nhân vật
          <input type="text" id="hero-name" maxlength="16" placeholder="Ví dụ: Lãng Khách" required>
        </label>
        <div class="field" style="display:grid;gap:6px"><span style="font-weight:600">Chọn lớp</span>
          <div class="classes">
            ${Object.entries(CLASSES).map(([id, c]) => `
              <button type="button" class="class-opt" data-cls="${id}" aria-pressed="${pickCls === id}">
                ${icon(c.icon, 'lg')}
                <span class="grow" style="display:grid;gap:2px;min-width:0">
                  <b>${c.name}</b>
                  <span class="small muted">${c.desc}</span>
                  <span class="stats">Sức mạnh ${c.base.str} · Thể lực ${c.base.vit} · Nhanh nhẹn ${c.base.agi} · Phòng thủ ${c.base.def}</span>
                  <span class="small" style="color:var(--gold)">Kỹ năng: ${c.skill.name}. ${c.skill.desc}</span>
                </span>
              </button>`).join('')}
          </div>
        </div>
        <button class="btn primary block" type="submit">Bắt đầu hành trình</button>
      </form>`;
  }

  // ---------- Làng ----------
  function nextBossIndex() {
    return ZONES.findIndex((z) => !P.bosses.includes(z.boss.id));
  }

  function viewTown() {
    const d = E.derived(P), cost = E.restCost(P), full = P.hp >= d.maxHp;
    const ni = nextBossIndex();
    const pots = ['potion_s', 'potion_m', 'potion_l'].reduce((s, id) => s + (P.inv[id] || 0), 0);
    return `
      <div class="card">
        <div class="row">${icon('campfire', 'lg')}<div class="grow"><h3>Nhà trọ</h3><p class="small muted">Ngủ một đêm để hồi đầy máu.</p></div></div>
        <button class="btn ${full ? '' : 'primary'} block" data-act="rest" ${full ? 'disabled' : ''}>${full ? 'Máu đang đầy' : cost ? `Nghỉ trọ · ${fmt(cost)} vàng` : 'Nghỉ trọ · miễn phí'}</button>
      </div>

      <div class="card">
        <div class="row"><h3 class="grow">Hành trình diệt rồng</h3><span class="tag gold num">${P.bosses.length}/${ZONES.length} trùm</span></div>
        <div class="journey">
          ${ZONES.map((z, i) => `<div class="step ${P.bosses.includes(z.boss.id) ? 'done' : i === ni ? 'next' : ''}">${sprite(z.boss.id, '', z.boss.name)}<span>${z.boss.name}</span></div>`).join('')}
        </div>
        ${ni >= 0 ? `<p class="small muted">Mục tiêu kế tiếp: hạ <b style="color:var(--parch)">${ZONES[ni].boss.name}</b> (cấp ${ZONES[ni].boss.level}) ở ${ZONES[ni].name}.</p>` : '<p class="small" style="color:var(--gold)">Bạn đã hạ tất cả trùm. Vùng đất đã bình yên.</p>'}
        <button class="btn block" data-tab="hunt">${icon('crossed-swords')} Đi săn quái</button>
      </div>

      ${pots === 0 ? `<div class="card"><div class="row">${icon('health-potion', 'lg')}<div class="grow"><h3>Hết bình máu</h3><p class="small muted">Mua vài bình ở cửa hàng trước khi đi săn xa.</p></div><button class="btn" data-tab="shop">Mua</button></div></div>` : ''}

      <div class="card">
        <h3>Thành tích</h3>
        <div class="stat-grid">
          <div class="stat"><span class="small muted">Quái đã hạ</span><b>${fmt(P.kills)}</b></div>
          <div class="stat"><span class="small muted">Số lần gục ngã</span><b>${fmt(P.deaths)}</b></div>
        </div>
      </div>

      <div class="card">
        <h3>Dữ liệu</h3>
        <p class="small muted">Game tự lưu trong trình duyệt này sau mỗi thao tác.</p>
        ${confirmReset
          ? `<p class="small" style="color:var(--bad)">Xóa nhân vật ${esc(P.name)} và chơi lại từ đầu? Không thể hoàn tác.</p>
             <div class="btn-row"><button class="btn" data-act="reset-cancel">Giữ lại</button><button class="btn danger" data-act="reset-yes">Xóa và chơi lại</button></div>`
          : `<button class="btn" data-act="reset-ask">Chơi lại từ đầu</button>`}
      </div>`;
  }

  function viewVictory() {
    return `
      <div class="card victory">
        ${sprite('shadow_dragon', '', 'Hắc Long đã chết')}
        <h1>Chiến thắng!</h1>
        <p>${esc(P.name)} đã tiêu diệt Hắc Long ở cấp ${P.level} sau ${fmt(P.kills)} trận đánh. Bạn vẫn có thể tiếp tục luyện cấp và săn quái.</p>
      </div>`;
  }

  // ---------- Săn quái ----------
  function viewHunt() {
    return `<h2 class="display">Vùng đất</h2>` + ZONES.map((z, i) => {
      const open = E.zoneUnlocked(P, i), cleared = P.bosses.includes(z.boss.id);
      return `
      <div class="card zone ${open ? '' : 'locked'} ${cleared ? 'cleared' : ''}">
        <div class="row">
          ${icon(z.icon, 'lg')}
          <div class="grow">
            <h3>${z.name}</h3>
            <div class="small muted">Cấp ${z.levels}</div>
          </div>
          <span class="tag ${cleared ? 'good' : open ? 'gold' : ''} zone-status">${cleared ? 'Đã hạ trùm' : open ? 'Đã mở' : 'Chưa mở'}</span>
        </div>
        <p class="small muted">${z.desc}</p>
        <div class="mobs">${z.monsters.map((m) => sprite(m.id, '', m.name)).join('')}${sprite(z.boss.id, 'boss', z.boss.name)}</div>
        ${open ? `
          <div class="btn-row">
            <button class="btn primary" data-act="hunt" data-zone="${i}">${icon('crossed-swords')} Săn quái</button>
            <button class="btn" data-act="boss" data-zone="${i}">${icon('crowned-skull')} ${z.boss.final ? 'Đấu Hắc Long' : 'Đấu trùm'} · Cấp ${z.boss.level}</button>
          </div>`
        : `<p class="small">Hạ <b>${ZONES[i - 1].boss.name}</b> để mở.</p>`}
      </div>`;
    }).join('');
  }

  // ---------- Nhân vật ----------
  const STAT_INFO = {
    str: ['Sức mạnh', 'Tăng tấn công'],
    vit: ['Thể lực', 'Tăng máu tối đa'],
    agi: ['Nhanh nhẹn', 'Tăng chí mạng, né, một ít tấn công'],
    def: ['Phòng thủ', 'Giảm sát thương nhận vào'],
  };

  function itemStat(it) {
    if (it.atk) return `Tấn công +${it.atk}`;
    if (it.def) return `Phòng thủ +${it.def}`;
    if (it.heal) return `Hồi ${it.heal} máu`;
    return '';
  }

  function viewHero() {
    const d = E.derived(P), c = CLASSES[P.cls];
    return `
      <div class="card">
        <div class="row">
          ${sprite('hero', '', '')}
          <div class="grow"><h2 class="display">${esc(P.name)}</h2><div class="small muted">${c.name} · Cấp ${P.level}</div></div>
        </div>
        <div class="stat-grid">
          <div class="stat"><span class="small muted">Tấn công</span><b>${d.atk}</b></div>
          <div class="stat"><span class="small muted">Phòng thủ</span><b>${d.def}</b></div>
          <div class="stat"><span class="small muted">Chí mạng</span><b>${Math.round(d.crit * 100)}% <span class="small muted">×${d.critMult.toFixed(2)}</span></b></div>
          <div class="stat"><span class="small muted">Né đòn</span><b>${Math.round(d.dodge * 100)}%</b></div>
        </div>
      </div>

      <div class="card">
        <div class="row"><h3 class="grow">Tiềm năng</h3><span class="tag ${P.points ? 'gold' : ''} num">${P.points} điểm</span></div>
        <p class="small muted">Mỗi lần lên cấp nhận ${E.POINTS_PER_LEVEL} điểm để cộng vào chỉ số.</p>
        <div class="list alloc">
          ${Object.entries(STAT_INFO).map(([k, [n, hint]]) => `
            <div class="item">
              <div class="grow"><div class="name">${n} <span class="num">${P.stats[k]}</span></div><div class="small muted">${hint}</div></div>
              <button class="btn" data-act="alloc" data-stat="${k}" ${P.points ? '' : 'disabled'} aria-label="Cộng 1 điểm ${n}">+1</button>
              <button class="btn" data-act="alloc5" data-stat="${k}" ${P.points >= 5 ? '' : 'disabled'} aria-label="Cộng 5 điểm ${n}">+5</button>
            </div>`).join('')}
        </div>
      </div>

      <div class="card">
        <h3>Trang bị</h3>
        <div class="list">
          ${[['weapon', 'Vũ khí'], ['armor', 'Giáp'], ['shield', 'Khiên']].map(([slot, label]) => {
            const id = P.equip[slot], it = id ? ITEMS[id] : null;
            return `<div class="item">
              ${it ? icon(it.icon, 'lg') : `<span class="ic lg"></span>`}
              <div class="grow"><div class="small muted">${label}</div><div class="name">${it ? it.name : 'Trống'}</div>${it ? `<div class="small muted">${itemStat(it)}</div>` : ''}</div>
              ${slot === 'shield' && it ? `<button class="btn" data-act="unequip" data-slot="shield">Tháo</button>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="card">
        <div class="row">${icon(c.skill.icon, 'lg')}<div class="grow"><h3>${c.skill.name}</h3><p class="small muted">${c.skill.desc} Hồi chiêu ${c.skill.cooldown} lượt.</p></div></div>
      </div>`;
  }

  // ---------- Túi đồ ----------
  function compare(it) {
    const cur = P.equip[it.slot] ? ITEMS[P.equip[it.slot]] : null;
    const v = (x) => (x ? (x.atk || 0) + (x.def || 0) : 0);
    const diff = v(it) - v(cur);
    return diff > 0 ? `<span class="up">▲ ${diff}</span>` : '';
  }

  function viewBag() {
    const ids = Object.keys(P.inv).filter((id) => P.inv[id] > 0);
    const gear = ids.filter((id) => ITEMS[id].slot !== 'potion');
    const pots = ids.filter((id) => ITEMS[id].slot === 'potion');
    const d = E.derived(P);
    const rowFor = (id) => {
      const it = ITEMS[id], n = P.inv[id];
      const low = it.level && P.level < it.level;
      const main = it.slot === 'potion'
        ? `<button class="btn" data-act="use" data-id="${id}" ${P.hp >= d.maxHp ? 'disabled' : ''}>Dùng</button>`
        : `<button class="btn primary" data-act="equip" data-id="${id}" ${low ? 'disabled' : ''}>Trang bị</button>`;
      return `<div class="item">
        ${icon(it.icon, 'lg')}
        <div class="grow">
          <div class="name">${it.name}${n > 1 ? ` <span class="muted num">×${n}</span>` : ''}</div>
          <div class="small muted">${itemStat(it)} ${it.slot !== 'potion' ? compare(it) : ''}${low ? ` · <span style="color:var(--bad)">Cần cấp ${it.level}</span>` : ''}</div>
        </div>
        ${main}
        <button class="btn" data-act="sell" data-id="${id}" aria-label="Bán ${it.name}">Bán ${fmt(E.sellPrice(id))}</button>
      </div>`;
    };
    return `
      <div class="card">
        <h3>Bình máu</h3>
        ${pots.length ? `<div class="list">${pots.map(rowFor).join('')}</div>` : `<p class="small muted">Chưa có bình máu. Mua ở cửa hàng.</p>`}
      </div>
      <div class="card">
        <h3>Trang bị trong túi</h3>
        ${gear.length ? `<div class="list">${gear.map(rowFor).join('')}</div>` : `<p class="small muted">Đồ bạn mua hoặc nhặt được sẽ nằm ở đây. Đồ đang mặc xem ở tab Nhân vật.</p>`}
      </div>`;
  }

  // ---------- Cửa hàng ----------
  function viewShop() {
    const groups = [['potion', 'Bình máu'], ['weapon', 'Vũ khí'], ['armor', 'Giáp'], ['shield', 'Khiên']];
    return `<h2 class="display">Lò rèn & Tiệm thuốc</h2>` + groups.map(([slot, title]) => `
      <div class="card">
        <h3>${title}</h3>
        <div class="list">
          ${SHOP.filter((id) => ITEMS[id].slot === slot).map((id) => {
            const it = ITEMS[id];
            const low = it.level && P.level < it.level;
            const worn = P.equip[slot] === id;
            const owned = P.inv[id] || 0;
            const poor = P.gold < it.price;
            return `<div class="item">
              ${icon(it.icon, 'lg')}
              <div class="grow">
                <div class="name">${it.name}</div>
                <div class="small muted">${itemStat(it)} ${slot !== 'potion' ? compare(it) : ''}${low ? ` · <span style="color:var(--bad)">Cần cấp ${it.level}</span>` : ''}${worn ? ' · <span style="color:var(--good)">Đang dùng</span>' : ''}${owned ? ` · có ${owned}` : ''}</div>
              </div>
              ${slot === 'potion' ? `<button class="btn" data-act="buy5" data-id="${id}" ${P.gold < it.price * 5 ? 'disabled' : ''}>×5</button>` : ''}
              <button class="btn ${!low && !poor ? 'primary' : ''}" data-act="buy" data-id="${id}" ${low || poor ? 'disabled' : ''}>${icon('two-coins')}${fmt(it.price)}</button>
            </div>`;
          }).join('')}
        </div>
      </div>`).join('') + `<p class="small muted">Trùm Vua Khổng Lồ và Kim Long giữ những món đồ không bán ở đây.</p>`;
  }

  // ---------- Trận đấu ----------
  function viewBattle() {
    const b = P.battle, m = b.monster, d = E.derived(P), z = ZONES[b.zone];
    const skill = CLASSES[P.cls].skill;
    const pots = ['potion_s', 'potion_m', 'potion_l'].reduce((s, id) => s + (P.inv[id] || 0), 0);
    const floatHtml = fx && fx.mDmg != null
      ? `<span class="float ${fx.crit ? 'crit' : ''} ${fx.mDmg === 0 ? 'miss' : ''}">${fx.mDmg === 0 ? 'Trượt' : '-' + fmt(fx.mDmg)}</span>` : '';
    let bottom;
    if (!b.over) {
      bottom = `
        <div class="actions">
          <button class="btn primary" data-act="attack">${icon('broadsword')} Tấn công</button>
          <button class="btn" data-act="skill" ${b.skillCd ? 'disabled' : ''}>${icon(skill.icon)} ${skill.name}${b.skillCd ? ` (${b.skillCd})` : ''}</button>
          <button class="btn" data-act="potion" ${pots && P.hp < d.maxHp ? '' : 'disabled'}>${icon('health-potion')} Uống máu (${pots})</button>
          <button class="btn" data-act="flee">${icon('walk')} Bỏ chạy</button>
        </div>`;
    } else {
      const r = b.result, rw = b.reward;
      const title = r === 'win' ? (m.final ? 'Hắc Long đã chết!' : 'Chiến thắng!') : r === 'lose' ? 'Gục ngã' : 'Đã thoát';
      bottom = `
        <div class="card result ${r}">
          <h2>${title}</h2>
          ${rw ? `<p class="num">+${fmt(rw.xp)} kinh nghiệm · +${fmt(rw.gold)} vàng${rw.items.length ? ' · ' + rw.items.map((id) => ITEMS[id].name).join(', ') : ''}</p>` : ''}
          ${rw && rw.levels ? `<p style="color:var(--gold);font-weight:600">Lên cấp ${P.level}! Vào tab Nhân vật để cộng điểm.</p>` : ''}
          <div class="btn-row">
            ${!m.boss && r !== 'lose' ? `<button class="btn primary" data-act="again">${icon('crossed-swords')} Đánh tiếp</button>` : ''}
            <button class="btn" data-act="leave">${icon('village')} Về làng</button>
          </div>
          ${!m.boss && r !== 'lose' && P.hp < d.maxHp * 0.35 ? '<p class="small" style="color:var(--bad)">Máu đang thấp. Nên uống máu hoặc về làng nghỉ.</p>' : ''}
        </div>`;
    }
    return `
      <div class="stage ${m.boss ? 'boss' : ''}" style="background-image:url('${asset('floors/' + z.id + '.png')}')">
        <span class="eyebrow">${z.name}${m.boss ? ' · Trùm' : ''}</span>
        ${sprite(m.id, fx && fx.mDmg ? 'hit' : '', m.name)}
        ${floatHtml}
        <h2>${m.name}</h2>
        <span class="small muted">Cấp ${m.level} · Tấn công ${m.atk} · Phòng thủ ${m.def}${m.special ? ` · ${m.special.name} mỗi ${m.special.every} lượt` : ''}</span>
        ${bar(m.boss ? 'boss' : 'hp', m.hp, m.maxHp)}
      </div>
      <div class="me ${fx && fx.pDmg ? 'hurt' : ''}">
        ${sprite('hero', '', '')}
        <div class="grow" style="flex:1;min-width:0">${bar('hp', P.hp, d.maxHp, `${esc(P.name)} · ${fmt(P.hp)} / ${fmt(d.maxHp)}`)}</div>
      </div>
      <div class="log" aria-live="polite">${b.log.map((l) => `<div class="${l.kind}">${esc(l.text)}</div>`).join('')}</div>
      ${bottom}`;
  }

  // ---------- Xử lý thao tác ----------
  function battleAct(action) {
    const m = P.battle.monster;
    const mBefore = m.hp, pBefore = P.hp, logLen = P.battle.log.length;
    const r = E.act(P, action);
    if (!r.ok) return toast(r.msg, true);
    const newLog = P.battle.log.slice(logLen);
    const struck = action === 'attack' || action === 'skill';
    fx = {
      mDmg: struck ? mBefore - m.hp : null,
      pDmg: pBefore - P.hp > 0 ? pBefore - P.hp : 0,
      crit: newLog.some((l) => l.kind === 'crit'),
    };
  }

  function onClick(e) {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.cls) { pickCls = t.dataset.cls; document.querySelectorAll('.class-opt').forEach((b) => b.setAttribute('aria-pressed', b.dataset.cls === pickCls)); return; }
    if (t.dataset.tab) { tab = t.dataset.tab; confirmReset = false; render(); $('#view').scrollTop = 0; return; }
    const act = t.dataset.act;
    if (!act || !P) return;
    const id = t.dataset.id, zi = +t.dataset.zone;
    switch (act) {
      case 'rest': result(E.rest(P)); break;
      case 'hunt': result(E.startBattle(P, zi, false)); break;
      case 'boss': result(E.startBattle(P, zi, true)); break;
      case 'attack': case 'skill': case 'potion': case 'flee': battleAct(act); break;
      case 'again': { const z = P.battle.zone; E.leaveBattle(P); result(E.startBattle(P, z, false)); break; }
      case 'leave': E.leaveBattle(P); tab = 'town'; break;
      case 'alloc': result(E.allocate(P, t.dataset.stat, 1)); break;
      case 'alloc5': result(E.allocate(P, t.dataset.stat, 5)); break;
      case 'equip': result(E.equip(P, id)); break;
      case 'unequip': result(E.unequip(P, t.dataset.slot)); break;
      case 'use': result(E.usePotion(P, id)); break;
      case 'sell': result(E.sell(P, id)); break;
      case 'buy': result(E.buy(P, id, 1)); break;
      case 'buy5': result(E.buy(P, id, 5)); break;
      case 'reset-ask': confirmReset = true; break;
      case 'reset-cancel': confirmReset = false; break;
      case 'reset-yes': P = null; confirmReset = false; tab = 'town'; break;
    }
    save();
    const scroll = $('#view').scrollTop;
    render();
    if (!P || !P.battle) $('#view').scrollTop = scroll;
  }

  function onSubmit(e) {
    if (e.target.id !== 'create') return;
    e.preventDefault();
    const name = $('#hero-name').value.trim();
    if (!name) { toast('Hãy đặt tên cho nhân vật.', true); return; }
    P = E.newPlayer(name, pickCls);
    tab = 'town';
    save();
    render();
    $('#view').scrollTop = 0;
    toast(`Chào mừng ${P.name}!`);
  }

  function start(hotData) {
    if (hotData && hotData.save) { try { P = E.deserialize(hotData.save); tab = hotData.tab || 'town'; } catch (e) { P = load(); } }
    else P = load();
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    render();
  }

  // Giữ trạng thái khi trang được cập nhật trong trình xem artifact.
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ save: P ? E.serialize(P) : null, tab }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
