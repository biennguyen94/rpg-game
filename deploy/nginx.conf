# Mẫu nginx làm TLS proxy (nginx cài thẳng trên VPS, chứng chỉ lấy bằng certbot). Xem
# docs/DEPLOY.md, cách 3: lấy chứng chỉ (certbot certonly --nginx) trước, rồi mới đặt file này
# vào /etc/nginx/sites-available/hac-long và ln -s sang sites-enabled.
# Game chạy bằng docker compose với APP_BIND=127.0.0.1 (chỉ nginx vào được cổng 4000).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name game.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # WebSocket (/socket) của Phoenix Channels
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # kết nối game để mở lâu
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
